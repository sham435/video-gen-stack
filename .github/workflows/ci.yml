name: CI — NEWS-MONSTER Validation
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm install --include=optional

      - name: Run test suite (node:test)
        run: npm test

      - name: Syntax check scripts
        run: |
          for f in scripts/*.mjs; do
            node --check "$f" && echo "  OK: $f" || echo "  FAIL: $f"
          done

      - name: Syntax check src modules
        run: |
          for f in src/**/*.mjs; do
            [ -f "$f" ] && node --check "$f" && echo "  OK: $f" || echo "  FAIL: $f"
          done

      - name: Syntax check packages
        run: |
          for f in packages/**/*.mjs packages/**/*.js; do
            [ -f "$f" ] && node --check "$f" 2>/dev/null && echo "  OK: $f" || echo "  SKIP: $f"
          done

      - name: Validate JSON templates
        run: |
          for f in src/templates/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f')); console.log('  OK: $f')"
          done

      - name: Verify module imports resolve
        run: |
          node -e "
            const modules = [
              'src/index.mjs', 'src/video/SceneEngine.mjs', 'src/video/CaptionEngine.mjs',
              'src/video/MotionEngine.mjs', 'src/video/Timeline.mjs',
              'src/audio/VoiceSync.mjs', 'src/audio/AudioMixer.mjs', 'src/audio/SoundFX.mjs',
              'src/ai/NewsAnalyzer.mjs', 'src/ai/BRollSelector.mjs',
              'src/quality/QualityChecker.mjs', 'scripts/tts.mjs', 'scripts/captions.mjs'
            ];
            Promise.all(modules.map(m => import('./' + m).then(() => console.log('  IMPORT OK:', m)).catch(e => {
              console.log('  IMPORT FAIL:', m, e.message);
              process.exitCode = 1;
            }))).then(() => console.log('All imports resolved'));
          "

      - name: Check assets exist
        run: |
          [ -f assets/fonts/Anton-Regular.ttf ] && echo '  Font: Anton OK'
          [ -f assets/fonts/Inter-Black.ttf ] || [ -f assets/fonts/Inter-Bold.ttf ] && echo '  Font: Inter OK'
