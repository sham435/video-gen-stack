name: CI — Validate Changes
on:
  push:
    branches: [develop]
    paths:
      - 'scripts/**'
      - 'packages/**'
      - 'apps/**'
      - 'assets/**'
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=optional

      - name: Check syntax of all scripts
        run: |
          for f in scripts/*.mjs packages/**/*.mjs .github/scripts/*.mjs; do
            [ -f "$f" ] && node --check "$f" && echo "✅ $f" || echo "❌ $f"
          done

      - name: Test intro module
        run: node -e "
          import('./scripts/intro.mjs').then(m => {
            console.log('✅ intro.mjs loads OK, fns:', Object.keys(m).join(', '))
          })
        "

      - name: Test composer syntax
        run: node -e "
          import('./scripts/composer.mjs').catch(e => {
            if (e.message.includes('better-sqlite3')) {
              console.log('✅ composer.mjs OK (DB skip in CI)')
            } else throw e
          })
        "

      - name: Test pexels module
        run: node -e "
          import('./scripts/pexels.mjs').then(m => {
            console.log('✅ pexels.mjs loads OK')
          })
        "

      - name: Verify assets
        run: |
          [ -f assets/fonts/Anton-Regular.ttf ] && echo '✅ Anton font' || echo '❌ Anton font'
          [ -f assets/music/intro_whoosh.mp3 ] && echo '✅ Intro audio' || echo '❌ Intro audio'
