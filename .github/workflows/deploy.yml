name: Deploy to Railway
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why deploy?'
        required: false
        default: 'manual deploy'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Check Railway availability
        id: check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "https://video-gen-stack-production.up.railway.app/api/health" 2>&1)
          echo "railway_up=$([ "$STATUS" = "200" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "Status: $STATUS"

      - name: Deploy to Railway
        if: steps.check.outputs.railway_up == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway login --token "$RAILWAY_TOKEN"
          railway up --service video-gen-stack

      - name: Skip
        if: steps.check.outputs.railway_up != 'true'
        run: echo "⏳ Railway unavailable (free tier sleep). Manual deploy needed when awake."
