name: Publish News Video — NEWS-MONSTER Broadcast
on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'News category'
        required: false
        default: 'technology'
      title:
        description: 'Override article title (optional)'
        required: false
        default: ''

concurrency:
  group: publish-news
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install --include=optional
      - name: Syntax check all modules
        run: |
          for f in src/**/*.mjs scripts/*.mjs packages/**/*.mjs; do
            [ -f "$f" ] && node --check "$f" 2>/dev/null || true
          done
          echo "All modules validated"
      - name: Validate template
        run: node -e "JSON.parse(require('fs').readFileSync('src/templates/breaking-news.json')); console.log('Template valid')"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Restore production memory + retention snapshots
        uses: actions/cache@v5
        with:
          path: data
          key: newsroom-data-v1

      - name: Install dependencies
        run: npm install --include=optional

      - name: Install FFmpeg + TTS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip espeak
          pip3 install edge-tts -q

      - name: Pick category (rotates through selections every 30 min — 6 per 3h cycle, 48 posts/day max)
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.category }}" ]; then
            cat="${{ github.event.inputs.category }}"
          else
            cats=(technology tesla apple wsj techcrunch business)
            idx=$(( ($(date +%H) * 2 + $(date +%M) / 30) % ${#cats[@]} ))
            cat="${cats[$idx]}"
          fi
          echo "category=$cat" >> "$GITHUB_OUTPUT"
          echo "Selected: $cat"

      - name: Generate NEWS-MONSTER Broadcast
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_PRIVACY: public
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          QUICK_RENDER: 'true'
          INPUT_CATEGORY: ${{ steps.pick.outputs.category }}
        run: node scripts/composer.mjs '${{ github.event.inputs.title || '' }}'

      - name: Persist production memory + retention snapshots
        if: always()
        uses: actions/cache@v5
        with:
          path: data
          key: newsroom-data-v1

  retention-learning:
    # Daily 3:23am — calibrate ProductionMemory with real viewer analytics
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Restore production memory + retention snapshots
        uses: actions/cache@v5
        with:
          path: data
          key: newsroom-data-v1
      - name: Install dependencies
        run: npm install --include=optional
      - name: Learn retention patterns
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: node scripts/retention-learning.mjs
      - name: Persist calibrated production memory
        if: always()
        uses: actions/cache@v5
        with:
          path: data
          key: newsroom-data-v1
