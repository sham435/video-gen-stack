name: Publish News Video — NEWS-MONSTER Broadcast
on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'News category'
        required: false
        default: 'technology'
      title:
        description: 'Override article title (optional)'
        required: false
        default: ''

# ── DevOps guardrail ───────────────────────────────────────────────────────
# Every FAILED run opens a GitHub Issue on this repo. Issues create email
# notifications to the repo's watch list, so a broken workflow emails you
# instead of silently dying. (Also enable GitHub's own email pings:
# github.com/settings/notifications → Actions → Email.)
env:
  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

concurrency:
  group: publish-news
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm install --include=optional
      - name: Syntax check all modules
        run: |
          FAILED=0
          for f in src/**/*.mjs scripts/*.mjs packages/**/*.mjs; do
            [ -f "$f" ] && { node --check "$f" 2>/dev/null && echo "  OK: $f" || { echo "  FAIL: $f"; FAILED=1; }; }
          done
          exit $FAILED
      - name: Validate template
        run: node -e "JSON.parse(require('fs').readFileSync('src/templates/breaking-news.json')); console.log('Template valid')"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Restore production memory + retention snapshots
        uses: actions/cache@v5
        with:
          path: data
          key: newsroom-data-${{ github.run_id }}

      - name: Install dependencies
        run: npm install --include=optional

      - name: Install FFmpeg + TTS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip espeak
          pip3 install edge-tts -q

      - name: Pick category (rotates through selections every 30 min — 6 per 3h cycle, 48 posts/day max)
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.category }}" ]; then
            cat="${{ github.event.inputs.category }}"
          else
            cats=(technology tesla apple wsj techcrunch business)
            idx=$(( ($(date +%H) * 2 + $(date +%M) / 30) % ${#cats[@]} ))
            cat="${cats[$idx]}"
          fi
          echo "category=$cat" >> "$GITHUB_OUTPUT"
          echo "Selected: $cat"

      - name: Generate NEWS-MONSTER Broadcast
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_PRIVACY: public
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_URN: ${{ secrets.LINKEDIN_MEMBER_URN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          QUICK_RENDER: 'true'
          INPUT_CATEGORY: ${{ steps.pick.outputs.category }}
        run: |
          python3 -m pip install --user edge-tts -q
          PATH="$HOME/.local/bin:$PATH" node scripts/composer.mjs '${{ github.event.inputs.title || '' }}'

      - name: Persist production memory + retention snapshots
        if: always()
        uses: actions/cache@v5
        with:
          path: data
          key: newsroom-data-${{ github.run_id }}

      - name: Refresh landing page video feed
        if: always()
        run: node scripts/update-videos.mjs

      - name: Commit updated videos.json (triggers GitHub Pages deploy)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet public/videos.json; then
            echo "No feed change"
          else
            git config user.name "news-monster-bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/videos.json
            git commit -m "chore: refresh landing page video feed"
            git push origin main
          fi

  retention-learning:
    # Daily 3:23am — calibrate ProductionMemory with real viewer analytics.
    # Gated on the exact cron arm so it runs once a day, not on every */30 run.
    if: github.event.schedule == '23 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Restore production memory + retention snapshots
        uses: actions/cache@v5
        with:
          path: data
          key: newsroom-data-${{ github.run_id }}
      - name: Install dependencies
        run: npm install --include=optional
      - name: Learn retention patterns
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: node scripts/retention-learning.mjs
      - name: Refresh underperforming thumbnails (Milestone C3)
        # Daily self-improvement loop: correct CTR-relative thumbnails from the
        # same analytics the retention job just read. Best-effort + idempotent
        # (every video evaluated independently; failures skip that video).
        if: always()
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: node scripts/refresh-thumbnails.mjs --apply --limit=3
      - name: Persist calibrated production memory
        if: always()
        uses: actions/cache@v5
        with:
          path: data
          key: newsroom-data-${{ github.run_id }}

  gc-artifacts:
    # Daily 3:23am with retention-learning — reclaim the 1GB+ of render
    # artifacts each publish cycle leaves on the runner. Runs the safe,
    # published-ref-aware GC (never touches published batches) with --apply.
    if: github.event.schedule == '23 3 * * *'
    needs: retention-learning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Garbage-collect stale render artifacts
        run: node scripts/gc-artifacts.mjs --apply

  # ── DevOps alert — fires on ANY failure in the pipeline (24/7 guardrail) ──
  # Opens a GitHub Issue so the repo owner gets an email notification instead
  # of a silently broken run. Idempotent: keeps the latest failure issue open,
  # never spams duplicates for consecutive failed runs.
  notify-failure:
    if: failure() && github.event.schedule != ''
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Open failure issue (emails repo watchers)
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ env.RUN_URL }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = process.env.RUN_URL
            const title = `⛔ Publish pipeline FAILED — ${new Date().toISOString()}`
            const body = `Pipeline failed at ${new Date().toISOString()}.

            Run: ${runUrl}

            This was raised automatically by the notify-failure job so the
            repo owner is emailed. Check the Actions log above for the failing
            step, fix, and close this issue.

            _(dismiss: close and the next run will not reopen unless it fails again)_`

            // Keep at most one open alert: close previous ones so the inbox
            // never floods on a failure streak.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open',
              labels: ['pipeline-failure'],
              per_page: 10,
            })
            for (const issue of open) {
              if (!issue.pull_request) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: 'closed',
                })
              }
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['pipeline-failure'],
            })
