name: Auto-Resume Railway
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why resume?'
        required: false
        default: 'manual resume'

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - name: Check Railway status
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "https://video-gen-stack-production.up.railway.app/api/health" 2>&1)
          echo "Railway status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Railway is awake"
          else
            echo "⏳ Railway is asleep (free tier). Run deploy.yml to wake it."
          fi
