<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="metaTitle">NEWS-MONSTER — 16:9 News Videos</title>
<meta name="description" id="metaDescription" content="NEWS-MONSTER — an autonomous 16:9 news video factory. Fresh vertical-free, full-HD news videos every 30 minutes.">

<!-- Open Graph / SEO -->
<meta property="og:site_name" content="NEWS-MONSTER">
<meta property="og:type" content="website">
<meta property="og:title" id="ogTitle" content="NEWS-MONSTER — 16:9 News Videos">
<meta property="og:description" id="ogDescription" content="Autonomous 16:9 news videos, produced by the NEWS-MONSTER factory. A fresh drop every 30 minutes.">
<meta property="og:image" id="ogImage" content="">
<meta property="og:image:width" content="3840">
<meta property="og:image:height" content="2160">
<meta property="og:image:type" content="image/png">
<meta property="og:url" id="ogUrl" content="">
<meta property="og:video:url" id="ogVideoUrl" content="">
<meta property="og:video:width" content="3840">
<meta property="og:video:height" content="2160">
<meta property="og:video:type" content="text/html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" id="twTitle" content="NEWS-MONSTER — 16:9 News Videos">
<meta name="twitter:description" id="twDescription" content="Autonomous 16:9 news videos, produced by the NEWS-MONSTER factory.">
<meta name="twitter:image" id="twImage" content="">

<link rel="preconnect" href="https://www.youtube-nocookie.com">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050505;--surface:#0a0a0c;--card:#101014;--border:rgba(255,255,255,.08);
  --text:#f0ece4;--muted:#8a8a9a;--gold:#c9a84c;--gold-dim:rgba(201,168,76,.14);
  --red:#e03030;--font:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  --gutter:48px;
}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden}

.veil{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 45% at 50% -8%,rgba(201,168,76,.06),transparent 55%),
             radial-gradient(ellipse 50% 35% at 85% 100%,rgba(224,48,48,.04),transparent 55%);}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* ── Header ─────────────────────────────────────────────── */
header{display:flex;align-items:center;justify-content:space-between;padding:28px var(--gutter) 0}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text)}
.logo-mark{width:42px;height:42px;border-radius:8px;background:var(--red);display:grid;place-items:center;
  font-weight:800;font-size:15px;letter-spacing:.5px;box-shadow:0 0 24px rgba(224,48,48,.4)}
.logo-text{font-weight:700;font-size:18px;letter-spacing:1.5px;text-transform:uppercase}
nav{display:flex;gap:28px;align-items:center}
nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.8px;
  text-transform:uppercase;transition:color .2s}
nav a:hover{color:var(--text)}

/* ── Spotlight Hero ─────────────────────────────────────── */
.spotlight{padding:56px var(--gutter) 8px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);
  gap:48px;max-width:1480px;margin:0 auto;width:100%;align-items:center}
.spot-video{aspect-ratio:16/9;position:relative;border-radius:18px;overflow:hidden;
  border:1px solid var(--border);background:#000;box-shadow:0 30px 90px rgba(0,0,0,.55)}
.spot-video iframe{width:100%;height:100%;border:0;display:block}
.spot-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border:1px solid var(--gold-dim);
  border-radius:999px;font-size:11px;font-weight:600;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:20px}
.spot-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.spot-cat{color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:12px;margin-bottom:12px}
.spot-title{font-weight:800;font-size:clamp(24px,3vw,40px);line-height:1.12;letter-spacing:-.5px;margin-bottom:14px}
.spot-desc{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:20px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.spot-meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin-bottom:24px;flex-wrap:wrap}
.spot-meta .sep{opacity:.35}
.spot-actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{padding:12px 24px;border-radius:12px;font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:.5px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;gap:8px;transition:all .2s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--gold);color:#0a0a0c;border-color:var(--gold)}
.btn.primary:hover{background:#d4b354}
.btn.small{padding:8px 16px;border-radius:10px;font-size:12px}

/* ── Filter Tabs ────────────────────────────────────────── */
.filters{display:flex;justify-content:flex-start;gap:8px;margin:44px auto 0;padding:6px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;width:fit-content;max-width:100%}
.filter-btn{padding:8px 20px;border:none;background:transparent;color:var(--muted);font-family:var(--font);
  font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border-radius:10px;cursor:pointer;
  transition:all .25s}
.filter-btn:hover{color:var(--text)}
.filter-btn.active{background:var(--gold);color:#0a0a0c}

/* ── Grid Section ───────────────────────────────────────── */
.grid-section{flex:1;padding:48px var(--gutter) 80px;max-width:1480px;margin:0 auto;width:100%}
.section-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px}
.section-title{font-weight:800;font-size:24px;letter-spacing:-.3px}
.section-count{color:var(--muted);font-size:13px;font-weight:500}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-4px);border-color:rgba(201,168,76,.35);box-shadow:0 16px 50px rgba(0,0,0,.45)}
.card-thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#0d0d10}
.card-thumb img{width:100%;height:100%;object-fit:contain;display:block;background:#000;
  transition:transform .4s ease,filter .4s ease}
.card:hover .card-thumb img{filter:brightness(.8)}
.card-thumb .play-badge{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .3s}
.card:hover .play-badge{opacity:1}
.play-circle{width:56px;height:56px;border-radius:50%;background:rgba(201,168,76,.92);display:grid;place-items:center;
  box-shadow:0 4px 24px rgba(0,0,0,.5)}
.play-circle svg{width:22px;height:22px;fill:#0a0a0c;margin-left:3px}
.card-meta{padding:16px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-title{font-size:15px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto}
.card-cta{display:flex;align-items:center;gap:8px}
.card-info{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.card-info .cat{color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.card-info .sep{opacity:.3}
.card-info .date{white-space:nowrap}

/* Empty / loading state */
.empty{color:var(--muted);text-align:center;padding:80px 0;grid-column:1/-1;font-size:15px}

/* ── Footer ─────────────────────────────────────────────── */
footer{padding:32px var(--gutter);border-top:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;color:var(--muted);font-size:12px}
footer a{color:var(--gold);text-decoration:none;transition:opacity .2s}
footer a:hover{opacity:.7}

/* ── Responsive ─────────────────────────────────────────── */
@media(max-width:960px){
  .spotlight{grid-template-columns:1fr;gap:28px}
  .spot-title{font-size:28px}
}
@media(max-width:768px){
  header{padding:20px 20px 0}
  .spotlight{padding:40px 20px 0}
  .grid-section{padding:36px 20px 60px}
  footer{flex-direction:column;gap:12px;text-align:center;padding:24px 20px}
  nav{gap:16px}
  nav a{font-size:11px}
}
@media(max-width:480px){
  .grid{grid-template-columns:1fr}
  .spot-actions .btn{flex:1;justify-content:center}
}
</style>
</head>
<body>
<div class="veil"></div>

<div class="app">
  <header>
    <a class="logo" href="./">
      <div class="logo-mark">NM</div>
      <div class="logo-text">NEWS-MONSTER</div>
    </a>
    <nav>
      <a href="https://www.youtube.com/channel/UC4UC7z16EtqtI-TJzeGZKjQ" target="_blank" rel="noopener">YouTube</a>
      <a href="https://www.linkedin.com/company/106599590" target="_blank" rel="noopener">LinkedIn</a>
    </nav>
  </header>

  <!-- Spotlight Hero -->
  <section class="spotlight" id="spotlight">
    <div class="spot-video" id="spotVideo">
      <div class="empty">Loading latest video…</div>
    </div>
    <div class="spot-info">
      <div class="spot-badge"><span class="dot"></span> LATEST DROP</div>
      <div class="spot-cat" id="spotCat">&nbsp;</div>
      <h1 class="spot-title" id="spotTitle">&nbsp;</h1>
      <p class="spot-desc" id="spotDesc"></p>
      <div class="spot-meta" id="spotMeta"></div>
      <div class="spot-actions">
        <a class="btn primary" id="spotWatch" href="#" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19" fill="currentColor"/></svg>
          Watch on YouTube
        </a>
        <a class="btn" id="spotPage" href="#">Open video page</a>
        <a class="btn" id="spotDownload" href="#" download="NEWS-MONSTER.mp4">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>
          Download
        </a>
      </div>
    </div>
  </section>

  <!-- Filters -->
  <div class="filters" id="filters" style="margin-left:var(--gutter);margin-right:var(--gutter)">
    <button class="filter-btn active" data-filter="all">All</button>
  </div>

  <!-- Grid -->
  <section class="grid-section">
    <div class="section-header">
      <div class="section-title" id="gridTitle">Latest Videos</div>
      <div class="section-count" id="sectionCount"></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>
    <div><strong>NEWS-MONSTER</strong> &middot; 16:9 Autonomous Video Factory</div>
    <div>
      <a href="https://www.youtube.com/channel/UC4UC7z16EtqtI-TJzeGZKjQ">Subscribe on YouTube</a>
      &nbsp;&middot;&nbsp;
      <a href="./videos.json">videos.json</a>
      &nbsp;&middot;&nbsp;
      <a href="/admin/dashboard">Admin</a>
    </div>
  </footer>
</div>

<script>
(function() {
  'use strict';

  const CHANNEL_ID = 'UC4UC7z16EtqtI-TJzeGZKjQ';

  // Canonical niche key → display label (kept aligned with the pipeline's
  // NicheResolver keys: TESLA/APPLE/AI/SAMSUNG/GOOGLE/MICROSOFT/SPACE/GAMING/CRYPTO/GENERAL).
  const LABELS = {
    tesla:'Technology', apple:'Technology', ai:'Technology', samsung:'Technology',
    google:'Technology', microsoft:'Technology', space:'Science', gaming:'Gaming',
    crypto:'Business', business:'Business', technology:'Technology',
    science:'Science', health:'Health', entertainment:'Business',
    general:'News', news:'News', music:'Music', tech:'Technology',
  };
  // Preferred display order so the baseline filter tabs render first.
  const ORDER = ['Technology','Business','Gaming','Science','Health','News','Music'];

  const grid = document.getElementById('grid');
  const filters = document.getElementById('filters');
  const sectionCount = document.getElementById('sectionCount');
  const gridTitle = document.getElementById('gridTitle');

  let allVideos = [];
  let filtered = [];
  let activeFilter = 'all';

  function labelOf(v) {
    const c = String(v.category || '').toLowerCase();
    return LABELS[c] || (c ? c.charAt(0).toUpperCase() + c.slice(1) : 'News');
  }

  function esc(s) {
    return (s == null ? '' : String(s))
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function watchUrl(v) { return v.watchUrl || v.youtubeUrl || (v.id ? 'https://www.youtube.com/watch?v=' + v.id : '#'); }
  function thumbOf(v) { return v.thumbnail || (v.id ? './thumbnails/' + v.id + '.png' : ''); }
  function detailLink(v) { return v.id || v.videoId ? './videos/' + (v.id || v.videoId) + '.html' : '#'; }
  // Committed downloadable mp4 lives at ./videos/{id}.mp4 (matches GitHub Pages + self-hosted /videos).
  function downloadUrl(v) { return v.downloadUrl || (v.id ? './videos/' + v.id + '.mp4' : '#'); }

  // ── Build filter buttons from data (baseline + any new categories) ──
  function buildFilters(videos) {
    const present = new Set(videos.map(labelOf));
    const ordered = [...ORDER.filter(c => present.has(c)), ...[...present].filter(c => !ORDER.includes(c))];
    ordered.forEach(label => {
      const b = document.createElement('button');
      b.className = 'filter-btn';
      b.dataset.filter = label;
      b.textContent = label;
      b.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        activeFilter = label;
        applyFilter();
      });
      filters.appendChild(b);
    });
  }

  function applyFilter() {
    filtered = activeFilter === 'all'
      ? [...allVideos]
      : allVideos.filter(v => labelOf(v) === activeFilter);
    gridTitle.textContent = activeFilter === 'all' ? 'Latest Videos' : activeFilter + ' Videos';
    sectionCount.textContent = filtered.length + ' video' + (filtered.length === 1 ? '' : 's');
    renderGrid();
  }

  function renderGrid() {
    if (!filtered.length) {
      grid.innerHTML = '<div class="empty">No videos in this category yet.</div>';
      return;
    }
    grid.innerHTML = filtered.map(v => `
      <div class="card">
        <a class="card-thumb" href="${watchUrl(v)}" target="_blank" rel="noopener" aria-label="${esc(v.title)} — watch on YouTube">
          <img src="${esc(thumbOf(v))}" alt="${esc(v.title)}" loading="lazy"
               onerror="this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'">
          <div class="play-badge"><div class="play-circle"><svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg></div></div>
        </a>
        <div class="card-meta">
          <a class="card-title" href="${watchUrl(v)}" target="_blank" rel="noopener">${esc(v.title)}</a>
          <div class="card-footer">
            <div class="card-info">
              <span class="cat">${esc(labelOf(v))}</span>
              <span class="sep">&middot;</span>
              ${v.publishedLabel ? `<span class="date">${esc(v.publishedLabel)}</span>` : ''}
            </div>
            <div class="card-cta">
              <a class="btn small primary" href="${watchUrl(v)}" target="_blank" rel="noopener">Watch</a>
              <a class="btn small" href="${downloadUrl(v)}" download="NEWS-MONSTER-${esc(v.id)}.mp4">Download</a>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  // ── Spotlight hero (persisted video-detail.json, fallback videos.json) ──
  async function loadSpotlight() {
    try {
      const res = await fetch('video-detail.json?ts=' + Date.now());
      if (res.ok) {
        const d = await res.json();
        if (d && d.videoId) return d;
      }
    } catch {}
    // Fallback: latest from videos.json
    if (allVideos.length) return allVideos[0];
    return null;
  }

  function renderSpotlight(d) {
    if (!d) return;
    const id = d.videoId || d.id;
    const metaVals = [];
    if (d.category) metaVals.push(`<span class="cat" style="color:var(--gold);font-weight:700">${esc(labelOf(d))}</span>`);
    if (d.publishedLabel) metaVals.push(`<span>${esc(d.publishedLabel)}</span>`);
    if (d.thumbnailAspectRatio || d.thumbnailWidth) {
      metaVals.push(`<span>${esc(d.thumbnailWidth || 3840)}\u00d7${esc(d.thumbnailHeight || 2160)}</span>`);
    }
    document.getElementById('spotCat').textContent = labelOf(d) || 'News';
    document.getElementById('spotTitle').textContent = d.title || '';
    document.getElementById('spotDesc').textContent = d.description || '';
    document.getElementById('spotMeta').innerHTML = metaVals.join('<span class="sep">&middot;</span>');
    const watch = document.getElementById('spotWatch');
    watch.href = watchUrl(d);
    const page = document.getElementById('spotPage');
    page.href = detailLink(d);
    const dl = document.getElementById('spotDownload');
    dl.href = downloadUrl(d);
    dl.setAttribute('download', id ? 'NEWS-MONSTER-' + id + '.mp4' : 'NEWS-MONSTER.mp4');
    if (id) {
      document.getElementById('spotVideo').innerHTML =
        `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&rel=0&playsinline=1"
          title="${esc(d.title || '')}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share"
          allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    }
  }

  // ── SEO / Open Graph from latest video ──
  function applySeo(d) {
    if (!d) return;
    const title = (d.title ? d.title + ' | NEWS-MONSTER 16:9 News Videos' : 'NEWS-MONSTER — 16:9 News Videos');
    document.title = title;
    const desc = (d.description || 'Autonomous 16:9 news videos from the NEWS-MONSTER factory.').slice(0, 200);
    const set = (id, val) => { const el = document.getElementById(id); if (el && val) el.setAttribute('content', val); };
    set('metaDescription', desc);
    set('ogTitle', title); set('ogDescription', desc);
    set('ogUrl', window.location.href);
    if (d.thumbnailUrl) { set('ogImage', d.thumbnailUrl); set('twImage', d.thumbnailUrl); }
    if (d.watchUrl) set('ogVideoUrl', d.watchUrl);
    set('twTitle', title); set('twDescription', desc);
  }

  async function init() {
    try {
      const res = await fetch('videos.json?ts=' + Date.now());
      if (!res.ok) throw new Error('status ' + res.status);
      const data = await res.json();
      allVideos = (data.videos || []).filter(v => v.id || v.videoId);
    } catch {
      grid.innerHTML = '<div class="empty">Could not load the video feed.</div>';
      return;
    }

    buildFilters(allVideos);
    applyFilter();

    const detail = await loadSpotlight();
    renderSpotlight(detail);
    applySeo(detail);
  }

  init();
})();
</script>
</body>
</html>
