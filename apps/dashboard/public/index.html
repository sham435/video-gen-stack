<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Gen Stack</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.5">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2"/>
        </svg>
        <h1>Video Gen</h1>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </div>
        <div class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          Models
        </div>
        <div class="nav-item" onclick="window.open('/dashboard.html','_self')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          Pipeline
        </div>
      </nav>
    </aside>

    <div class="main">
      <header class="header">
        <div class="header-title">AI Video</div>
        <div class="header-actions">
          <button class="header-btn" id="new-chat-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New
          </button>
        </div>
      </header>

      <div class="conversation" id="conversation">
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#86868b" stroke-width="1.5">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2"/>
          </svg>
          <h2>Video Generation</h2>
          <p>Describe the scene or story for your video. Powered by fal.ai.</p>
        </div>
      </div>

      <div class="input-area">
        <div class="options-row">
          <div class="option-group">
            <label>Duration:</label>
            <select id="duration-select">
              <option value="3">3s</option>
              <option value="5" selected>5s</option>
              <option value="7">7s</option>
              <option value="10">10s</option>
            </select>
          </div>
          <div class="option-group">
            <label>Aspect:</label>
            <select id="ratio-select">
              <option value="16:9">16:9</option>
              <option value="16:9">16:9</option>
            </select>
          </div>
        </div>

        <div class="model-bar">
          <select class="model-select" id="provider-select"></select>
          <select class="model-select" id="model-select"></select>
          <span class="model-badge foss" id="model-badge">FOSS</span>
          <span class="option-group" id="free-hint" style="font-size:12px;color:#2e7d32;"></span>
        </div>

        <div class="input-wrapper">
          <textarea id="prompt-input" rows="1" placeholder="Describe the scene or story for your video..."></textarea>
          <button class="send-btn" id="send-btn">Generate</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
